name: Tests

on:
    pull_request:
        branches: [main]

    push:
        branches: [main]

    workflow_dispatch:

concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
    tests:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Unit tests
              run: go test ./...
